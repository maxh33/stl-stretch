[project]
name = "3d-printing"
version = "0.1.0"
description = "Lengthen STL/3MF parts for 3D printing without distorting holes, threads or chamfers"
readme = "README.md"
license = "MIT"
authors = [{ name = "Max Haider" }]
keywords = ["3d-printing", "stl", "3mf", "mesh", "trimesh", "bambu-studio", "cli-tool", "python"]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "manifold3d>=3.5.3",
    "mapbox-earcut>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "trimesh>=5.1.0",
]
